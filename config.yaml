# ==============================================================================
# MULTIMODAL INTELLIGENT TRIAGE ASSISTANT (RESEARCH & EDUCATIONAL PROTOTYPE)
# Master Configuration File
# ==============================================================================

# Global Project Settings
project:
  name: "Multimodal Intelligent Triage Assistant"
  version: "0.1.0"
  seed: 42
  device: "cuda"  # Options: "cuda", "cpu", or "auto"
  disclaimer: >
    RESEARCH AND EDUCATIONAL PROTOTYPE ONLY: This software is designed exclusively
    for experimental research in multimodal deep learning and clinical decision support.
    It does NOT provide medical diagnoses, replace clinical judgement, or direct
    patient treatment. All predictions are stochastic model outputs requiring human review.

# Data Paths & Delimiters
data:
  raw:
    triage_csv: "data/raw/triage/data.csv"
    triage_delimiter: ";"
    xray_dir: "data/raw/xray/"
    voice_dir: "data/raw/voice/"
  processed:
    processed_dir: "data/processed/"
    train_split: "data/processed/train.parquet"
    val_split: "data/processed/val.parquet"
    test_split: "data/processed/test.parquet"
    preprocessor_artifact: "models/checkpoints/preprocessor.joblib"
    text_embeddings_cache: "data/processed/text_embeddings_minilm.pt"
  splits:
    test_size: 0.15
    val_size: 0.15
    stratify_by: "KTAS_RN"

# Feature Taxonomy (Refined during Module 2 Leakage Analysis)
features:
  target: "KTAS_RN"
  num_classes: 5  # KTAS Levels 1 through 5
  
  # Text Modality
  text_features:
    - "Chief_complain"

  # Vitals Modality (Physiological measurements taken at admission)
  vitals_features:
    - "SBP"
    - "DBP"
    - "HR"
    - "RR"
    - "BT"
    - "Saturation"
    - "Mental"
    - "Pain"
    - "NRS_pain"

  # Context Modality (Demographics & operational context)
  context_features:
    categorical:
      - "Sex"
      - "Arrival mode"
      - "Injury"
    numerical:
      - "Age"
      - "Patients number per hour"

  # Formal Feature Taxonomy from Module 2 Data Leakage Analysis
  safe_features:
    - "Chief_complain"
    - "SBP"
    - "DBP"
    - "HR"
    - "RR"
    - "BT"
    - "Saturation"
    - "Mental"
    - "Pain"
    - "NRS_pain"
    - "Sex"
    - "Age"
    - "Arrival mode"
    - "Injury"

  potentially_unsafe_features:
    - "Patients number per hour"
    - "Group"

  excluded_features:
    - "Diagnosis in ED"
    - "Disposition"
    - "KTAS_expert"
    - "Error_group"
    - "Length of stay_min"
    - "KTAS duration_min"
    - "mistriage"

# Modality Architectures & Hyperparameters

text_encoder:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_dim: 384
  max_length: 64
  freeze_weights: true
  tfidf:
    max_features: 300
    ngram_range: [1, 2]

vitals_encoder:
  input_dim: 9
  hidden_dim: 64
  embedding_dim: 128
  dropout: 0.2
  use_batch_norm: true
  activation: "GELU"

context_encoder:
  embedding_dim: 64
  cat_embedding_dims:
    Sex: 8
    "Arrival mode": 16
    Injury: 8
  numerical_dim: 2
  hidden_dim: 64
  dropout: 0.2

fusion_model:
  baseline_fusion_dim: 576  # 384 (text) + 128 (vitals) + 64 (context)
  adaptive_fusion_dim: 128
  classification_head:
    hidden_dims: [128, 64]
    dropout: 0.3
    num_classes: 5
  modality_dropout_prob: 0.15  # For training robustness against missing modalities

training:
  batch_size: 32
  learning_rate: 0.0005
  weight_decay: 0.001
  max_epochs: 50
  early_stopping_patience: 8
  lr_scheduler: "ReduceLROnPlateau"
  class_weights: "balanced"  # Handle triage class imbalance

uncertainty:
  mc_dropout_passes: 25
  entropy_threshold: 0.85
  alert_message: "High model uncertainty — human review required."

explainability:
  shap:
    background_samples: 100
  feature_attribution: "IntegratedGradients"

vision_module:
  model_architecture: "densenet121"  # Or "efficientnet_b0"
  pretrained: true
  image_size: 224
  num_findings: 14  # NIH Chest X-ray classes
  batch_size: 16
  learning_rate: 0.0001
  gradcam_target_layer: "features.denseblock4.denselayer16.conv2"

voice_module:
  whisper_model: "tiny"
  sample_rate: 16000
  language: "en"

outputs:
  models_dir: "models/checkpoints/"
  plots_dir: "outputs/plots/"
  metrics_dir: "outputs/metrics/"
  predictions_dir: "outputs/predictions/"
