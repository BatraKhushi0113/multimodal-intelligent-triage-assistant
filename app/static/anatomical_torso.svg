<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="lungGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Soft Capsule -->
  <rect width="300" height="400" rx="16" fill="#F0F9FF"/>

  <!-- Torso & Head Silhouette -->
  <!-- Head -->
  <ellipse cx="150" cy="55" rx="32" ry="40" fill="url(#bodyGrad)"/>
  <!-- Neck -->
  <path d="M136,88 L136,115 L164,115 L164,88 Z" fill="url(#bodyGrad)"/>
  <!-- Shoulders and Torso -->
  <path d="M70,140 C85,120 120,115 150,115 C180,115 215,120 230,140 C245,160 250,210 240,290 C235,330 220,380 200,395 L100,395 C80,380 65,330 60,290 C50,210 55,160 70,140 Z" fill="url(#bodyGrad)"/>

  <!-- Trachea -->
  <rect x="146" y="112" width="8" height="45" rx="4" fill="#0EA5E9" filter="url(#glow)"/>
  <!-- Bronchial bifurcation -->
  <path d="M147,155 Q130,170 115,185 M153,155 Q170,170 185,185" stroke="#0EA5E9" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#glow)"/>

  <!-- Left Lung (Viewer's Left, Anatomical Right) -->
  <path d="M110,170 C135,170 140,195 140,240 C140,270 125,285 105,280 C85,275 75,250 80,210 C85,180 95,170 110,170 Z" fill="url(#lungGrad)" filter="url(#glow)" opacity="0.9"/>
  <!-- Right Lung (Viewer's Right, Anatomical Left) -->
  <path d="M190,170 C165,170 160,195 160,240 C160,270 175,285 195,280 C215,275 225,250 220,210 C215,180 205,170 190,170 Z" fill="url(#lungGrad)" filter="url(#glow)" opacity="0.9"/>

  <!-- Bronchial branches inside lungs -->
  <path d="M118,190 Q105,210 95,235 M118,205 Q120,225 115,255 M112,220 Q95,235 90,255" stroke="#E0F2FE" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M182,190 Q195,210 205,235 M182,205 Q180,225 185,255 M188,220 Q205,235 210,255" stroke="#E0F2FE" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Subtle Rib lines -->
  <path d="M90,195 Q150,215 210,195 M85,225 Q150,245 215,225 M85,255 Q150,275 215,255" stroke="#BAE6FD" stroke-width="1.5" stroke-dasharray="3,3" fill="none" opacity="0.5"/>
</svg>
